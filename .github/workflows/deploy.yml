name: Deploy to Server
on:
  push:
    branches:
      - main
      - feature/partOne
      - feature/partTwo
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_PASSWORD: ${{ secrets.ROOT_DEPLOY_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Define archive path
        run: echo "ARCHIVE_PATH=$RUNNER_TEMP/b2-etl-release.tar.gz" >> "$GITHUB_ENV"
      - name: Package repository
        run: tar --exclude='.git' -czf "$ARCHIVE_PATH" .
      - name: Upload bundle to server
        run: sshpass -p "$DEPLOY_PASSWORD" scp -P 22 -o StrictHostKeyChecking=no "$ARCHIVE_PATH" root@62.60.228.129:/tmp/b2-etl-release.tar.gz
      - name: Deploy on remote host
        run: |
          sshpass -p "$DEPLOY_PASSWORD" ssh -p 22 -o StrictHostKeyChecking=no root@62.60.228.129 <<'EOF'
          set -euo pipefail
          DEPLOY_PATH="/root/b2-etl-itmodata"
          mkdir -p "$DEPLOY_PATH"
          chown root:"root" "$DEPLOY_PATH"
          tar -xzf /tmp/b2-etl-release.tar.gz -C "$DEPLOY_PATH"
          rm /tmp/b2-etl-release.tar.gz
          cd "$DEPLOY_PATH"

          # Stop running containers before touching bind-mounted folders
          docker compose down || true

          export AIRFLOW_UID="$(id -u)"
          export AIRFLOW_GID=0
          printf "AIRFLOW_UID=%s\nAIRFLOW_GID=%s\n" "$AIRFLOW_UID" "$AIRFLOW_GID" > airflow.env
          chmod 664 airflow.env

          # Ensure report output directory exists on the host for the elementary-report container
          mkdir -p dbt/target
          # Airflow containers run as "${AIRFLOW_UID}:0" (group root). Make target writable by group.
          chown -R root:root dbt/target
          chmod -R 775 dbt/target

          # Logs can contain nested scheduler folders; make cleanup idempotent
          rm -rf logs || true
          mkdir -p logs dags plugins
          chmod -R 775 logs
          chown -R root:"root" logs dags plugins
          if ! docker compose up -d --build; then
            docker compose logs --no-color --tail=200 airflow-init || true
            exit 1
          fi
          echo "--- compose ps ---"
          docker compose ps

          echo "--- smoke checks (localhost) ---"
          # Helpers
          retry() {
            local name="$1"; shift
            local attempts="${1:-30}"; shift
            local sleep_s="${1:-2}"; shift
            local n=1
            while true; do
              if "$@"; then
                echo "OK: $name"
                return 0
              fi
              if [ "$n" -ge "$attempts" ]; then
                echo "FAIL: $name (after ${attempts} attempts)" >&2
                return 1
              fi
              n=$((n+1))
              sleep "$sleep_s"
            done
          }

            # Debug trace (test environment; helps pinpoint early exits)
            set -x

          dump_logs() {
            echo "--- airflow-webserver logs (tail) ---" || true
            docker compose logs --no-color --tail=120 airflow-webserver || true
            echo "--- airflow-scheduler logs (tail) ---" || true
            docker compose logs --no-color --tail=120 airflow-scheduler || true
            echo "--- weather-service logs (tail) ---" || true
            docker compose logs --no-color --tail=120 weather-service || true
            echo "--- elementary-report logs (tail) ---" || true
            docker compose logs --no-color --tail=120 elementary-report || true
          }

          # Airflow webserver can take time to start; use the /health endpoint
            retry "airflow /health" 40 3 curl -fsS http://localhost:8080/health >/dev/null || { dump_logs; exit 1; };

          # Weather service
            retry "weather-service /health" 20 2 curl -fsS http://localhost:8000/health >/dev/null || { dump_logs; exit 1; };

          # Elementary report server (index should respond; report file appears after DAG run)
            retry "elementary-report port" 20 2 curl -fsSI http://localhost:8081/ >/dev/null || { dump_logs; exit 1; };

          # If we reached here, all ports/endpoints are up
          curl -fsSI http://localhost:8080/health | head -n 5
          curl -fsS http://localhost:8000/health
          echo
          curl -fsSI http://localhost:8081/ | head -n 5

          echo "--- database checks ---"
            retry "postgres pg_isready" 30 2 docker compose exec -T postgres pg_isready -U airflow || { dump_logs; exit 1; };
            retry "mongodb ping" 30 2 docker compose exec -T mongodb mongosh --quiet --username weather --password weather --authenticationDatabase admin --eval "db.runCommand({ ping: 1 })" || { dump_logs; exit 1; };
            echo "OK: database checks passed"

          echo "--- post-deploy pipeline run (weather_ingest + el_weather) ---"
          # Ensure DAGs are unpaused
          # Airflow webserver may be healthy slightly earlier than the scheduler CLI is usable.
            retry "airflow CLI" 20 3 docker compose exec -T airflow-scheduler airflow version >/dev/null || { dump_logs; exit 1; };

            # After a cold start, DAG parsing can lag behind /health. Wait until the scheduler sees our DAGs.
            retry "airflow sees DAG weather_ingest" 40 3 bash -lc "docker compose exec -T airflow-scheduler airflow dags list | grep -q '^weather_ingest'" || { dump_logs; exit 1; };
            retry "airflow sees DAG el_weather" 40 3 bash -lc "docker compose exec -T airflow-scheduler airflow dags list | grep -q '^el_weather'" || { dump_logs; exit 1; };

          docker compose exec -T airflow-scheduler airflow dags unpause weather_ingest || true
          docker compose exec -T airflow-scheduler airflow dags unpause el_weather || true

          # For @hourly EL DAG: use the current UTC hour as logical date.
          # IMPORTANT: future logical dates stay queued until their time comes.
          CUR_HOUR_UTC="$(date -u +"%Y-%m-%dT%H:00:00+00:00")"
          echo "Using CUR_HOUR_UTC=$CUR_HOUR_UTC"

          wait_dag_run() {
            local dag_id="$1"
            local run_id="$2"
            local timeout_s="${3:-900}"
            local started
            started="$(date +%s)"
            while true; do
              # Parse list-runs output: dag_id | run_id | state | ...
              state="$(docker compose exec -T airflow-scheduler airflow dags list-runs -d "$dag_id" --no-backfill -o table \
                | awk -F'|' -v rid="$run_id" 'BEGIN{IGNORECASE=1} $2 ~ rid {gsub(/^[ \t]+|[ \t]+$/, "", $3); print $3; exit}')"

              if [ -n "$state" ]; then
                echo "$dag_id/$run_id state=$state"
                case "$state" in
                  success) return 0 ;;
                  failed|upstream_failed) return 1 ;;
                esac
              fi

              now="$(date +%s)"
              if [ $((now-started)) -ge "$timeout_s" ]; then
                echo "Timeout waiting for $dag_id/$run_id" >&2
                return 1
              fi
              sleep 10
            done
          }

          # Generate a bit of data, then run EL once for the current hour to build dbt + Elementary report.
          TS="$(date -u +"%Y%m%dT%H%M%SZ")"
          for i in 1 2; do
            INGEST_RUN_ID="postdeploy_weather_ingest_${TS}_${i}"
            echo "Triggering weather_ingest run_id=$INGEST_RUN_ID"
            docker compose exec -T airflow-scheduler airflow dags trigger weather_ingest --run-id "$INGEST_RUN_ID"
            wait_dag_run weather_ingest "$INGEST_RUN_ID" 300 || { dump_logs; exit 1; }
          done

          EL_RUN_ID="postdeploy_el_weather_${TS}"
          echo "Triggering el_weather exec_date=$CUR_HOUR_UTC run_id=$EL_RUN_ID"
          docker compose exec -T airflow-scheduler airflow dags trigger el_weather --exec-date "$CUR_HOUR_UTC" --run-id "$EL_RUN_ID"
          wait_dag_run el_weather "$EL_RUN_ID" 1800 || { dump_logs; exit 1; }

          echo "--- verify outputs ---"
          docker compose exec -T postgres psql -U airflow -d analytics -c "SELECT count(*) AS weather_raw_rows FROM weather_raw;" | cat
          ROWS="$(docker compose exec -T postgres psql -U airflow -d analytics -tA -c "SELECT count(*) FROM weather_raw;" | tr -d '[:space:]')"
          if [ "${ROWS:-0}" -lt 1 ]; then
            echo "Expected weather_raw to have rows, got ${ROWS:-0}" >&2
            dump_logs
            exit 1
          fi

          # Verify Elementary report is served (file appears after edr_report task)
          echo "--- dbt target directory (host + airflow container) ---"
          ls -la dbt/target | head -n 50 || true
          docker compose exec -T airflow-scheduler bash -lc "ls -la /opt/airflow/dbt/target | head -n 50" || true

            # Try to generate the report directly once (idempotent). This removes dependence on Airflow task timing.
            docker compose exec -T airflow-scheduler bash -lc "cd /opt/airflow/dbt && edr report --file-path target/elementary_report.html --profiles-dir ." || true

            echo "--- report diagnostics (host/container/server) ---"
            echo "Host permissions:"
            ls -ld dbt dbt/target || true
            ls -la dbt/target | head -n 200 || true
            echo "Airflow container permissions:"
            docker compose exec -T airflow-scheduler bash -lc "id && ls -ld /opt/airflow/dbt/target && ls -la /opt/airflow/dbt/target | head -n 200" || true
            echo "File existence checks:"
            test -f dbt/target/elementary_report.html && echo "OK: host dbt/target/elementary_report.html exists" || echo "MISSING: host dbt/target/elementary_report.html"
            docker compose exec -T airflow-scheduler bash -lc "test -f /opt/airflow/dbt/target/elementary_report.html && echo OK: airflow /opt/airflow/dbt/target/elementary_report.html exists || echo MISSING: airflow /opt/airflow/dbt/target/elementary_report.html" || true
            echo "Report server directory listing (HTTP):"
            curl -fsS http://localhost:8081/ | head -n 120 || true
            echo "Report server directory listing (container):"
            docker compose exec -T elementary-report bash -lc "ls -ld /reports && ls -la /reports | head -n 200" || true

          # Verify Elementary report is served (file appears after edr_report task)
          if ! retry "elementary_report.html" 30 5 curl -fsSI http://localhost:8081/elementary_report.html >/dev/null; then
            echo "Report not served yet; attempting direct report generation as fallback" >&2
              echo "--- report diagnostics (before fallback) ---"
              curl -fsSI http://localhost:8081/elementary_report.html || true
              curl -fsS http://localhost:8081/ | head -n 120 || true

              echo "--- airflow task diagnostics (edr_report) ---"
              docker compose exec -T airflow-scheduler airflow tasks state el_weather edr_report "$CUR_HOUR_UTC" || true
              docker compose exec -T airflow-scheduler airflow tasks logs el_weather edr_report "$CUR_HOUR_UTC" | tail -n 200 || true

            docker compose exec -T airflow-scheduler bash -lc "cd /opt/airflow/dbt && dbt deps && dbt run --select elementary --full-refresh && dbt run && dbt test && edr report --file-path target/elementary_report.html --profiles-dir ."
            ls -la dbt/target | head -n 50 || true
            retry "elementary_report.html (after fallback)" 30 5 curl -fsSI http://localhost:8081/elementary_report.html >/dev/null || { dump_logs; exit 1; }
          fi
          echo "Elementary report is available at http://<host>:8081/elementary_report.html"

          echo "--- airflow-init logs (tail) ---"
          docker compose logs --no-color --tail=80 airflow-init
          EOF
