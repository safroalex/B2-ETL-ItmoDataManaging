name: Deploy to Server

on:
  push:
    branches:
      - main
      - feature/partOne
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_PASSWORD: ${{ secrets.ROOT_DEPLOY_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Define archive path
        run: echo "ARCHIVE_PATH=$RUNNER_TEMP/b2-etl-release.tar.gz" >> "$GITHUB_ENV"

      - name: Package repository
        run: tar --exclude='.git' -czf "$ARCHIVE_PATH" .

      - name: Upload bundle to server
        run: sshpass -p "$DEPLOY_PASSWORD" scp -P 22 -o StrictHostKeyChecking=no "$ARCHIVE_PATH" root@62.60.228.129:/tmp/b2-etl-release.tar.gz

      - name: Deploy on remote host
        run: |
          sshpass -p "$DEPLOY_PASSWORD" ssh -p 22 -o StrictHostKeyChecking=no root@62.60.228.129 <<'EOF'
          set -euo pipefail
          DEPLOY_PATH="/root/b2-etl-itmodata"
          mkdir -p "$DEPLOY_PATH"
          chown root:"root" "$DEPLOY_PATH"
          tar -xzf /tmp/b2-etl-release.tar.gz -C "$DEPLOY_PATH"
          rm /tmp/b2-etl-release.tar.gz
          cd "$DEPLOY_PATH"
          export AIRFLOW_UID="$(id -u)"
          export AIRFLOW_GID=0
          printf "AIRFLOW_UID=%s\nAIRFLOW_GID=%s\n" "$AIRFLOW_UID" "$AIRFLOW_GID" > airflow.env
          chmod 664 airflow.env
          rm -rf logs dags plugins
          mkdir -p logs dags plugins
          chmod -R 775 logs dags plugins
          chown -R root:"root" logs dags plugins
          docker compose down || true
          if ! docker compose up -d --build; then
            docker compose logs --no-color --tail=200 airflow-init || true
            exit 1
          fi
          docker compose logs --no-color --tail=50 airflow-init
          EOF
