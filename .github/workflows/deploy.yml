name: Deploy to Server

on:
  push:
    branches:
      - main
      - feature/partOne
  workflow_dispatch:

env:
  DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
  DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
  DEPLOY_USER: ${{ vars.DEPLOY_USER }}
  DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Define archive path
        run: echo "ARCHIVE_PATH=$RUNNER_TEMP/b2-etl-release.tar.gz" >> "$GITHUB_ENV"

      - name: Package repository
        run: tar --exclude='.git' -czf "$ARCHIVE_PATH" .

      - name: Upload bundle to server
        run: scp -P $DEPLOY_PORT -o StrictHostKeyChecking=no "$ARCHIVE_PATH" $DEPLOY_USER@$DEPLOY_HOST:/tmp/b2-etl-release.tar.gz

      - name: Deploy on remote host
        run: |
          ssh -p $DEPLOY_PORT -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_HOST <<EOF
          set -euo pipefail
          mkdir -p "$DEPLOY_PATH"
          chown "$DEPLOY_USER":"$DEPLOY_USER" "$DEPLOY_PATH"
          tar -xzf /tmp/b2-etl-release.tar.gz -C "$DEPLOY_PATH"
          rm /tmp/b2-etl-release.tar.gz
          cd "$DEPLOY_PATH"
          export AIRFLOW_UID="$(id -u)"
          export AIRFLOW_GID=0
          printf "AIRFLOW_UID=%s\nAIRFLOW_GID=%s\n" "$AIRFLOW_UID" "$AIRFLOW_GID" > airflow.env
          chmod 664 airflow.env
          rm -rf logs dags plugins
          mkdir -p logs dags plugins
          chmod -R 775 logs dags plugins
          chown -R "$DEPLOY_USER":"$DEPLOY_USER" logs dags plugins
          docker compose down || true
          if ! docker compose up -d --build; then
            docker compose logs --no-color --tail=200 airflow-init || true
            exit 1
          fi
          docker compose logs --no-color --tail=50 airflow-init
          EOF
