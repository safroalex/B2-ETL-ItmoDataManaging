name: Deploy to Server
on:
  push:
    branches:
      - main
      - feature/partOne
      - feature/partTwo
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_PASSWORD: ${{ secrets.ROOT_DEPLOY_PASSWORD }}
      # Keep SSH connection alive during long remote steps to avoid exit=255 on transient network drops.
      SSH_OPTS: >-
        -p 22
        -o StrictHostKeyChecking=no
        -o UserKnownHostsFile=/dev/null
        -o ServerAliveInterval=15
        -o ServerAliveCountMax=8
        -o ConnectTimeout=20
        -o TCPKeepAlive=yes
        -o LogLevel=ERROR
      SCP_OPTS: >-
        -P 22
        -o StrictHostKeyChecking=no
        -o UserKnownHostsFile=/dev/null
        -o ServerAliveInterval=15
        -o ServerAliveCountMax=8
        -o ConnectTimeout=20
        -o TCPKeepAlive=yes
        -o LogLevel=ERROR
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Define archive path
        run: echo "ARCHIVE_PATH=$RUNNER_TEMP/b2-etl-release.tar.gz" >> "$GITHUB_ENV"

      - name: Package repository
        run: tar --exclude='.git' -czf "$ARCHIVE_PATH" .

      - name: Upload bundle to server
        run: |
          sshpass -p "$DEPLOY_PASSWORD" scp $SCP_OPTS \
            "$ARCHIVE_PATH" root@62.60.228.129:/tmp/b2-etl-release.tar.gz

      - name: Remote - deploy stack (extract + compose up)
        run: |
          sshpass -p "$DEPLOY_PASSWORD" ssh $SSH_OPTS root@62.60.228.129 'bash -seuo pipefail' <<'EOF'
          echo "=== STEP: deploy stack (begin) ==="
          DEPLOY_PATH="/root/b2-etl-itmodata"
          mkdir -p "$DEPLOY_PATH"
          chown root:"root" "$DEPLOY_PATH"
          tar -xzf /tmp/b2-etl-release.tar.gz -C "$DEPLOY_PATH"
          rm /tmp/b2-etl-release.tar.gz
          cd "$DEPLOY_PATH"

          docker compose down || true

          export AIRFLOW_UID="$(id -u)"
          export AIRFLOW_GID=0
          printf "AIRFLOW_UID=%s\nAIRFLOW_GID=%s\n" "$AIRFLOW_UID" "$AIRFLOW_GID" > airflow.env
          chmod 664 airflow.env

          mkdir -p dbt/target
          chown -R root:root dbt/target
          chmod -R 775 dbt/target

          rm -rf logs || true
          mkdir -p logs dags plugins
          chmod -R 775 logs
          chown -R root:"root" logs dags plugins

          docker compose up -d --build
          echo "--- compose ps ---"
          docker compose ps
          echo "=== STEP: deploy stack (end) ==="
          EOF

      - name: Remote - smoke checks (Airflow UI)
        run: |
          sshpass -p "$DEPLOY_PASSWORD" ssh $SSH_OPTS root@62.60.228.129 'bash -seuo pipefail' <<'EOF'
          echo "=== STEP: smoke (begin) ==="
          cd /root/b2-etl-itmodata

          retry() {
            local name="$1"; shift
            local attempts="${1:-40}"; shift
            local sleep_s="${1:-3}"; shift
            local n=1
            while true; do
              if "$@"; then
                echo "OK: $name"
                return 0
              fi
              if [ "$n" -ge "$attempts" ]; then
                echo "FAIL: $name (after ${attempts} attempts)" >&2
                return 1
              fi
              n=$((n+1))
              sleep "$sleep_s"
            done
          }

          dump_logs() {
            echo "--- compose ps ---" || true
            docker compose ps || true
            echo "--- airflow-webserver logs (tail) ---" || true
            docker compose logs --no-color --tail=200 airflow-webserver || true
            echo "--- airflow-scheduler logs (tail) ---" || true
            docker compose logs --no-color --tail=200 airflow-scheduler || true
          }

          trap 'code=$?; if [ "$code" -ne 0 ]; then echo "--- SMOKE STEP FAILED (exit=$code) ---"; dump_logs; fi' EXIT

          retry "airflow /health" 60 3 bash -lc 'curl -fsS --connect-timeout 2 --max-time 5 http://localhost:8080/health >/dev/null 2>&1'
          echo "Airflow UI should be available on: http://62.60.228.129:8080"
          echo "Default creds (from docker-compose): admin / admin"
          echo "=== STEP: smoke (end) ==="
          EOF

      # NOTE: Heavy post-deploy pipeline steps (trigger DAGs, dbt, Elementary report)
      # were removed to keep deployments reliable when you only need Airflow UI.
