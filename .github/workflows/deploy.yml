name: Deploy to Server

on:
  push:
    branches:
      - main
      - feature/partOne
      - feature/partTwo
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_PASSWORD: ${{ secrets.ROOT_DEPLOY_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Define archive path
        run: echo "ARCHIVE_PATH=$RUNNER_TEMP/b2-etl-release.tar.gz" >> "$GITHUB_ENV"

      - name: Package repository
        run: tar --exclude='.git' -czf "$ARCHIVE_PATH" .

      - name: Upload bundle to server
        run: sshpass -p "$DEPLOY_PASSWORD" scp -P 22 -o StrictHostKeyChecking=no "$ARCHIVE_PATH" root@62.60.228.129:/tmp/b2-etl-release.tar.gz

      - name: Deploy on remote host
        run: |
          sshpass -p "$DEPLOY_PASSWORD" ssh -p 22 -o StrictHostKeyChecking=no root@62.60.228.129 <<'EOF'
          set -euo pipefail
          DEPLOY_PATH="/root/b2-etl-itmodata"
          mkdir -p "$DEPLOY_PATH"
          chown root:"root" "$DEPLOY_PATH"
          tar -xzf /tmp/b2-etl-release.tar.gz -C "$DEPLOY_PATH"
          rm /tmp/b2-etl-release.tar.gz
          cd "$DEPLOY_PATH"

          # Stop running containers before touching bind-mounted folders
          docker compose down || true

          export AIRFLOW_UID="$(id -u)"
          export AIRFLOW_GID=0
          printf "AIRFLOW_UID=%s\nAIRFLOW_GID=%s\n" "$AIRFLOW_UID" "$AIRFLOW_GID" > airflow.env
          chmod 664 airflow.env

          # Logs can contain nested scheduler folders; make cleanup idempotent
          rm -rf logs || true
          mkdir -p logs dags plugins
          chmod -R 775 logs
          chown -R root:"root" logs dags plugins
          if ! docker compose up -d --build; then
            docker compose logs --no-color --tail=200 airflow-init || true
            exit 1
          fi
          echo "--- compose ps ---"
          docker compose ps

          echo "--- smoke checks (localhost) ---"
          # Helpers
          retry() {
            local name="$1"; shift
            local attempts="${1:-30}"; shift
            local sleep_s="${1:-2}"; shift
            local n=1
            while true; do
              if "$@"; then
                echo "OK: $name"
                return 0
              fi
              if [ "$n" -ge "$attempts" ]; then
                echo "FAIL: $name (after ${attempts} attempts)" >&2
                return 1
              fi
              n=$((n+1))
              sleep "$sleep_s"
            done
          }

          dump_logs() {
            echo "--- airflow-webserver logs (tail) ---" || true
            docker compose logs --no-color --tail=120 airflow-webserver || true
            echo "--- airflow-scheduler logs (tail) ---" || true
            docker compose logs --no-color --tail=120 airflow-scheduler || true
            echo "--- weather-service logs (tail) ---" || true
            docker compose logs --no-color --tail=120 weather-service || true
            echo "--- elementary-report logs (tail) ---" || true
            docker compose logs --no-color --tail=120 elementary-report || true
          }

          # Airflow webserver can take time to start; use the /health endpoint
          retry "airflow /health" 40 3 curl -fsS http://localhost:8080/health >/dev/null || { dump_logs; exit 1; }

          # Weather service
          retry "weather-service /health" 20 2 curl -fsS http://localhost:8000/health >/dev/null || { dump_logs; exit 1; }

          # Elementary report server (index should respond; report file appears after DAG run)
          retry "elementary-report port" 20 2 curl -fsSI http://localhost:8081/ >/dev/null || { dump_logs; exit 1; }

          # If we reached here, all ports/endpoints are up
          curl -fsSI http://localhost:8080/health | head -n 5
          curl -fsS http://localhost:8000/health
          echo
          curl -fsSI http://localhost:8081/ | head -n 5

          echo "--- database checks ---"
          docker compose exec -T postgres pg_isready -U airflow
          docker compose exec -T mongodb mongosh --quiet --username weather --password weather --authenticationDatabase admin --eval "db.runCommand({ ping: 1 })"

          echo "--- airflow-init logs (tail) ---"
          docker compose logs --no-color --tail=80 airflow-init
          EOF
